<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Instruments</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2310151c'/%3E%3Cpath d='M8 22V10m5 12V13m5 9V8m5 14V12' stroke='%23e4c36a' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #10151c;
      --ink: #eef3f8;
      --muted: #8b93a1;
      --accent: #e4c36a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Instrument Serif", Georgia, serif;
      background:
        linear-gradient(180deg, rgba(228, 195, 106, 0.05), transparent 32%),
        radial-gradient(ellipse at 50% 110%, #1b2430, var(--bg) 58%);
      color: var(--ink);
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    main {
      width: min(32rem, calc(100vw - 3rem));
      text-align: center;
      display: grid;
      gap: 1.7rem;
      justify-items: center;
    }
    .kicker {
      font-size: 0.72rem;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--muted);
      font-style: normal;
    }
    h1 {
      font-size: clamp(2.8rem, 9vw, 4.6rem);
      font-weight: 400;
      letter-spacing: -0.03em;
      line-height: 0.95;
    }
    .stage {
      position: relative;
      width: 17rem;
      height: 17rem;
      display: grid;
      place-items: center;
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .play {
      position: relative;
      z-index: 1;
      width: 4.4rem;
      height: 4.4rem;
      border: 1px solid var(--accent);
      border-radius: 50%;
      background: transparent;
      color: var(--accent);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform 0.25s ease, background 0.25s ease;
    }
    .play:hover,
    .play.playing { background: rgba(228, 195, 106, 0.12); transform: scale(1.03); }
    .play:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    .play svg { width: 1.3rem; height: 1.3rem; margin-left: 2px; }
    .play.playing svg { margin-left: 0; }
    .transport {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.85rem;
      align-items: center;
    }
    .bar {
      height: 2px;
      background: rgba(238, 243, 248, 0.12);
      cursor: pointer;
    }
    .fill {
      height: 100%;
      width: 0;
      background: var(--accent);
    }
    .time {
      font-size: 0.8rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-style: italic;
    }
    audio { display: none; }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Stem 01</p>
    <h1>Instruments</h1>
    <div class="stage">
      <canvas id="viz" aria-hidden="true"></canvas>
      <button class="play" id="play" aria-label="Play">
        <svg id="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v13.72L19.5 12 8 5.14z"/></svg>
      </button>
    </div>
    <div class="transport">
      <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
      <span class="time" id="time">0:00</span>
    </div>
  </main>
  <audio id="audio" src="instruments.mp3" loop preload="auto"></audio>
  <script src="../shared/player.js"></script>
  <script>
    const audio = document.getElementById("audio");
    const playBtn = document.getElementById("play");
    const icon = document.getElementById("icon");
    const fill = document.getElementById("fill");
    const bar = document.getElementById("bar");
    const timeEl = document.getElementById("time");
    const canvas = document.getElementById("viz");
    const ctx = canvas.getContext("2d");
    wireStemPlayer(audio, playBtn, icon);

    function fmt(s) {
      if (!Number.isFinite(s)) return "0:00";
      return Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
    }
    function sizeCanvas() {
      const dpr = Math.min(devicePixelRatio, 2);
      canvas.width = canvas.clientWidth * dpr;
      canvas.height = canvas.clientHeight * dpr;
    }
    function draw() {
      const w = canvas.width, h = canvas.height, cx = w / 2, cy = h / 2;
      ctx.clearRect(0, 0, w, h);
      const t = audio.currentTime || 0;
      const bars = 48;
      ctx.strokeStyle = "#e4c36a";
      ctx.lineWidth = Math.max(1.5, w * 0.006);
      ctx.lineCap = "round";
      for (let i = 0; i < bars; i++) {
        const v = audio.paused
          ? 0.22
          : 0.35 + 0.65 * Math.abs(Math.sin(t * 2.2 + i * 0.33));
        const a = (i / bars) * Math.PI * 2 - Math.PI / 2 + t * 0.12;
        const inner = w * 0.18;
        const outer = inner + w * (0.12 + v * 0.18);
        ctx.globalAlpha = 0.22 + v * 0.65;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(a) * inner, cy + Math.sin(a) * inner);
        ctx.lineTo(cx + Math.cos(a) * outer, cy + Math.sin(a) * outer);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      requestAnimationFrame(draw);
    }
    audio.addEventListener("timeupdate", () => {
      fill.style.width = (audio.currentTime / (audio.duration || 1) * 100) + "%";
      timeEl.textContent = fmt(audio.currentTime);
    });
    bar.addEventListener("click", (e) => {
      const r = bar.getBoundingClientRect();
      audio.currentTime = ((e.clientX - r.left) / r.width) * (audio.duration || 0);
    });
    addEventListener("resize", sizeCanvas);
    sizeCanvas();
    draw();
  </script>
</body>
</html>

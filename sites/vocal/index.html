<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vocal</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a1014'/%3E%3Cpath d='M6 16c2-6 4 6 6 0s4-6 6 0 4 6 6 0' fill='none' stroke='%23e8a0b4' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,300&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #160e12;
      --ink: #f7e7e1;
      --muted: #c4a39a;
      --accent: #e8a0b4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: Fraunces, Georgia, serif;
      background:
        radial-gradient(ellipse at 70% 20%, rgba(232, 160, 180, 0.18), transparent 48%),
        radial-gradient(ellipse at 30% 80%, rgba(90, 40, 55, 0.55), transparent 42%),
        var(--bg);
      color: var(--ink);
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    main {
      width: min(30rem, calc(100vw - 3rem));
      text-align: center;
      display: grid;
      gap: 1.6rem;
      justify-items: center;
    }
    .kicker {
      font-family: Georgia, serif;
      font-size: 0.72rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--muted);
      font-style: normal;
    }
    h1 {
      font-size: clamp(3.6rem, 13vw, 5.8rem);
      font-weight: 300;
      font-style: italic;
      letter-spacing: -0.04em;
      line-height: 0.9;
    }
    .stage {
      width: 100%;
      height: 8.5rem;
      position: relative;
    }
    canvas { width: 100%; height: 100%; display: block; }
    .play {
      width: 4.25rem;
      height: 4.25rem;
      border: 0;
      border-radius: 50%;
      background: var(--accent);
      color: #2a1418;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      box-shadow: 0 16px 40px rgba(232, 160, 180, 0.28);
    }
    .play:hover { transform: scale(1.04); }
    .play:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
    .play svg { width: 1.3rem; height: 1.3rem; margin-left: 2px; }
    .play.playing svg { margin-left: 0; }
    .transport {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.85rem;
      align-items: center;
    }
    .bar {
      height: 2px;
      border-radius: 99px;
      background: rgba(247, 231, 225, 0.14);
      cursor: pointer;
    }
    .fill {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: var(--accent);
    }
    .time {
      font-size: 0.78rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-style: italic;
    }
    audio { display: none; }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Stem 02</p>
    <h1>Vocal</h1>
    <div class="stage"><canvas id="viz" aria-hidden="true"></canvas></div>
    <button class="play" id="play" aria-label="Play">
      <svg id="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v13.72L19.5 12 8 5.14z"/></svg>
    </button>
    <div class="transport">
      <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
      <span class="time" id="time">0:00</span>
    </div>
  </main>
  <audio id="audio" src="vocal.mp3" loop preload="auto"></audio>
  <script src="../shared/player.js"></script>
  <script>
    const audio = document.getElementById("audio");
    const playBtn = document.getElementById("play");
    const icon = document.getElementById("icon");
    const fill = document.getElementById("fill");
    const bar = document.getElementById("bar");
    const timeEl = document.getElementById("time");
    const canvas = document.getElementById("viz");
    const ctx = canvas.getContext("2d");
    wireStemPlayer(audio, playBtn, icon);

    function fmt(s) {
      if (!Number.isFinite(s)) return "0:00";
      return Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
    }
    function sizeCanvas() {
      const dpr = Math.min(devicePixelRatio, 2);
      canvas.width = canvas.clientWidth * dpr;
      canvas.height = canvas.clientHeight * dpr;
    }
    function draw() {
      const w = canvas.width, h = canvas.height, mid = h / 2;
      ctx.clearRect(0, 0, w, h);
      const t = audio.currentTime || 0;
      const amp = audio.paused ? 0.12 : 0.62;
      ctx.beginPath();
      for (let i = 0; i <= 180; i++) {
        const x = (i / 180) * w;
        const y = mid
          + Math.sin(i * 0.11 + t * 3.1) * mid * amp
          + Math.sin(i * 0.037 + t * 1.4) * mid * amp * 0.45;
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.strokeStyle = "rgba(232,160,180,0.92)";
      ctx.lineWidth = Math.max(2, w * 0.004);
      ctx.lineJoin = "round";
      ctx.stroke();
      requestAnimationFrame(draw);
    }
    audio.addEventListener("timeupdate", () => {
      fill.style.width = (audio.currentTime / (audio.duration || 1) * 100) + "%";
      timeEl.textContent = fmt(audio.currentTime);
    });
    bar.addEventListener("click", (e) => {
      const r = bar.getBoundingClientRect();
      audio.currentTime = ((e.clientX - r.left) / r.width) * (audio.duration || 0);
    });
    addEventListener("resize", sizeCanvas);
    sizeCanvas();
    draw();
  </script>
</body>
</html>
